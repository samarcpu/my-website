<!DOCTYPE html>
<html>
<head>

<title>My Professional Website</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7ff;
    color: #222;
    transition: 0.3s;
}

/* DARK MODE */

body.dark {
    background: #111827;
    color: white;
}

body.dark .about,
body.dark .card {
    background: #1f2937;
}

body.dark .contact input,
body.dark .contact textarea {
    background: #374151;
    color: white;
    border-color: #4b5563;
}

/* NAVBAR */

nav {
    background: #111827;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: white;
    font-size: 24px;
    font-weight: bold;
}

.links {
    display: flex;
    gap: 25px;
}

.links a {
    color: white;
    text-decoration: none;
    font-size: 16px;
}

.menu-btn,
.theme-btn {
    background: none;
    border: none;
    color: white;
    cursor: pointer;
}

.menu-btn {
    display: none;
    font-size: 30px;
}

.theme-btn {
    font-size: 22px;
}

/* HERO */

.hero {
    text-align: center;
    padding: 80px 20px;
}

.hero h1 {
    font-size: 45px;
    margin-bottom: 20px;
}

.hero p {
    font-size: 20px;
    margin-bottom: 25px;
}

.btn {
    background: #2563eb;
    color: white;
    padding: 14px 28px;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

.btn:active {
    transform: scale(0.95);
}

/* IMAGE */

.hero-image {
    width: 90%;
    max-width: 600px;
    margin: 30px auto;
    display: block;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

/* SERVICES */

.services {
    padding: 80px 20px;
    text-align: center;
}

.services h2 {
    font-size: 35px;
    margin-bottom: 40px;
}

.cards {
    max-width: 1000px;
    margin: auto;
    display: flex;
    gap: 25px;
    justify-content: center;
}

.card {
    background: white;
    padding: 30px 20px;
    border-radius: 12px;
    width: 30%;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-10px);
}

.card h3 {
    margin-bottom: 15px;
}

.card p {
    line-height: 1.5;
}

/* ABOUT */

.about {
    background: white;
    text-align: center;
    padding: 80px 20px;
}

.about h2,
.contact h2 {
    font-size: 32px;
    margin-bottom: 20px;
}

/* CONTACT */

.contact {
    text-align: center;
    padding: 80px 20px;
}

.form {
    max-width: 450px;
    margin: auto;
}

.form input,
.form textarea {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 16px;
}

.form textarea {
    height: 120px;
    resize: none;
}

.message {
    margin-top: 15px;
    font-weight: bold;
}

/* MOBILE */

@media (max-width: 700px) {

    nav {
        position: relative;
    }

    .menu-btn {
        display: block;
    }

    .links {
        display: none;
        position: absolute;
        top: 70px;
        left: 0;
        width: 100%;
        background: #111827;
        flex-direction: column;
        gap: 0;
        padding: 10px 0;
        z-index: 10;
    }

    .links.show {
        display: flex;
    }

    .links a {
        padding: 15px 20px;
    }

    .logo {
        font-size: 20px;
    }

    .hero {
        padding: 60px 15px;
    }

    .hero h1 {
        font-size: 36px;
    }

    .cards {
        flex-direction: column;
        align-items: center;
    }

    .card {
        width: 90%;
    }

}

</style>

</
